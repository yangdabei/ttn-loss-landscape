name: Comparator certificate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'TTN/**'
      - 'TTN.lean'
      - 'Challenge.lean'
      - 'comparator/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'formalization.yaml'
      - '.github/workflows/comparator.yml'
  pull_request:
    paths:
      - 'TTN/**'
      - 'TTN.lean'
      - 'Challenge.lean'
      - 'comparator/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'formalization.yaml'
      - '.github/workflows/comparator.yml'

permissions:
  contents: read

concurrency:
  group: comparator-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  main-results:
    name: Main results (Landrun + Lean kernel)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      LANDRUN_REV: 5ed4a3db3a4ad930d577215c6b9abaa19df7f99f
    defaults:
      run:
        shell: bash

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check out the trusted certificate and solution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the pinned Lean toolchain
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false

      - name: Install the pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.25.12'
          cache: false

      - name: Initialize without compiling production modules
        run: |
          set -euo pipefail
          cp lake-manifest.json "$RUNNER_TEMP/lake-manifest.json"
          lake update
          lake exe cache get
          cmp --silent "$RUNNER_TEMP/lake-manifest.json" lake-manifest.json
          test ! -e .lake/build/lib/lean/TTN.olean
          test ! -e .lake/build/lib/lean/TTN/Landscape/LocalMin.olean
          test ! -e .lake/build/lib/lean/TTN/Dynamics/ParityLowerBound.olean
          jq -e '.enable_nanoda == false' comparator/main.json > /dev/null

      - name: Build the pinned verification tools
        run: |
          set -euo pipefail
          go install "github.com/zouuup/landrun/cmd/landrun@${LANDRUN_REV}"
          landrun_bin="$(go env GOPATH)/bin/landrun"

          lake build comparator lean4export
          comparator_bin="$GITHUB_WORKSPACE/.lake/packages/Comparator/.lake/build/bin/comparator"
          lean4export_bin="$GITHUB_WORKSPACE/.lake/packages/lean4export/.lake/build/bin/lean4export"

          test -x "$landrun_bin"
          test -x "$comparator_bin"
          test -x "$lean4export_bin"
          echo "LANDRUN_BIN=$landrun_bin" >> "$GITHUB_ENV"
          echo "COMPARATOR_BIN=$comparator_bin" >> "$GITHUB_ENV"
          echo "LEAN4EXPORT_BIN=$lean4export_bin" >> "$GITHUB_ENV"

      - name: Require an effective Landrun filesystem sandbox
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          mkdir -p .lake/landrun-probe

          allowed="$GITHUB_WORKSPACE/.lake/landrun-probe/allowed"
          denied="$RUNNER_TEMP/ttn-landrun-denied-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          policy=(
            --best-effort
            --ro /
            --rw /dev
            --rwx "$GITHUB_WORKSPACE/.lake"
            --ldd
            --add-exec
          )

          "$LANDRUN_BIN" "${policy[@]}" /usr/bin/touch "$allowed"
          test -f "$allowed"
          if "$LANDRUN_BIN" "${policy[@]}" /usr/bin/touch "$denied"; then
            echo 'Landrun allowed a write outside the project .lake directory.' >&2
            exit 1
          fi
          test ! -e "$denied"

      - name: Run Comparator under the outer systemd network guard
        run: |
          set -euo pipefail
          sudo systemd-run --quiet --wait --pipe --collect \
            --uid="$(id -u)" \
            --gid="$(id -g)" \
            --property='RestrictAddressFamilies=~AF_UNIX' \
            --property='IPAddressDeny=any' \
            --property='NoNewPrivileges=yes' \
            --working-directory="$GITHUB_WORKSPACE" \
            --setenv="HOME=$HOME" \
            --setenv="PATH=$PATH" \
            --setenv="COMPARATOR_LANDRUN=$LANDRUN_BIN" \
            --setenv="COMPARATOR_LEAN4EXPORT=$LEAN4EXPORT_BIN" \
            "$(command -v lake)" env "$COMPARATOR_BIN" comparator/main.json

          {
            echo '### Comparator certificate passed'
            echo
            echo 'The trusted challenge matched all three production declarations.'
            echo 'The proofs used only the permitted axioms and passed Lean.'
          } >> "$GITHUB_STEP_SUMMARY"
