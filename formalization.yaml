# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/99c678e569c7c4c0772db297c5ddd5e4c9b6322e/schema/formalization.schema.json

# formalization.yaml (v0.4): repository-root metadata for formalization projects.
version: "v0.4"

project:
  name: "TTN Loss Landscapes"
  description: >-
    A Lean 4 and Mathlib formalization of the principal loss-landscape
    results for tree tensor networks accompanying Benign Loss Landscapes Can
    Coexist with Worst-Case Hardness.
  authors:
    - "Yangda Bei"
  responsible_maintainers:
    - "Yangda Bei"
  license: "Apache-2.0"

sources:
  - title: "Benign Loss Landscapes Can Coexist with Worst-Case Hardness"
    authors:
      - "Zach Furman"
      - "Stephan Wäldchen"
      - "Yangda Bei"
      - "Liam Hodgkinson"
    type: "manuscript"
    location: >-
      Theorem 4.3, Theorem 5.2, and the supporting results indexed in
      docs/correspondence.md
    relationship: "formalizes"
    author_endorsement: "endorsed"
    note: >-
      The manuscript does not yet have a public URL. Its authors checked that
      the mapped Lean statements faithfully represent the corresponding
      manuscript statements.

status:
  scope: >-
    The development formalizes the main minimum-norm and full-Tucker-rank loss
    landscape theorems and their supporting realizability, dormant-subspace,
    compression, and descent results. The escape-path corollary, separate
    stripping construction, minimal two-factor factorization results, parity
    example, computational-hardness, and Boolean-expressivity arguments are
    outside the release scope; further qualifications are recorded in
    docs/deviations.md.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Classical.choice"
    - "Quot.sound"
  main_results:
    - declaration: "TTN.Arch.minNorm_isLocalMin_isGlobalMin"
      file: "TTN/Landscape/LocalMin.lean"
      source_result: "Theorem 4.3"
      relation: "Exact"
      comparator_config: "comparator/main.json"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
    - declaration: "TTN.Arch.critical_fullRank_isGlobalMin"
      file: "TTN/Landscape/FullRank.lean"
      source_result: "Theorem 5.2"
      relation: "Exact"
      comparator_config: "comparator/main.json"
      sorry_count: 0
      axioms:
        - "propext"
        - "Classical.choice"
        - "Quot.sound"
automation:
  methods:
    - method: "agent"
      models:
        - "Anthropic Claude Fable 5"
        - "Anthropic Claude Opus 4.8"
      framework: "Claude Code"
      tool_setup: "Anthropic subscription-based access with Lean tooling."
      prompting_notes: >-
        Claude Fable 5 was the primary model for the substantive formalization;
        Claude Opus 4.8 handled selected proof obligations.
    - method: "agent"
      models:
        - "OpenAI GPT-5.5"
        - "OpenAI GPT-5.6-Sol"
      framework: "Codex"
      tool_setup: "OpenAI subscription-based access with Lean tooling."
      prompting_notes: >-
        Used for mathematical audits, proof-strategy review, selected proof
        bodies, and release verification.
    - method: "manual"
      tool_setup: >-
        Human integration, repository organization, and statement-level
        correspondence review.
  spend_usd: "subscription-based usage"
  notes: >-
    A complete record of token use, wall time, and API-equivalent cost was not
    retained.

fidelity:
  divergences: >-
    The directed root-based and undirected contraction presentations are
    identified after coordinate expansion by
    TTN.Arch.representedFromRoot_eq_represented. External modes are aggregated
    per node in the main development; the
    realizability/rank characterization alone is bridged to literal individual
    modes. The full-environment-rank lemma is proved in the leaf case consumed
    by the main argument. The proof uses connected-component dormant
    perturbations rather than the manuscript's iterative stripping narrative.
    The escape-path corollary is outside the release scope. The detailed
    qualifications and all specialization relations are recorded in
    docs/deviations.md and docs/correspondence.md.

review:
  status: "author-verified"
  notes: >-
    The manuscript authors checked the faithfulness of the mapped Lean
    statements. Comparator checks the two main formal statements and proof
    terms; AxiomAudit.lean reports their Lean-kernel axiom dependencies.

alignment:
  namespace: "TTN"
  index: "docs/correspondence.md"
  statements:
    - source: "Definitions 3.1 and B.5 — Directed and contraction TTN presentations"
      lean: "TTN.Arch.representedFromRoot_eq_represented"
      module: "TTN/Contraction.lean"
      status: "proved"
      relation: "Equivalent"
    - source: "Theorem 4.3 — Minimum-norm local minima are global"
      lean: "TTN.Arch.minNorm_isLocalMin_isGlobalMin"
      module: "TTN/Landscape/LocalMin.lean"
      status: "proved"
      relation: "Exact"
    - source: "Theorem 5.2 — Full-rank critical points are global"
      lean: "TTN.Arch.critical_fullRank_isGlobalMin"
      module: "TTN/Landscape/FullRank.lean"
      status: "proved"
      relation: "Exact"
acknowledgements: >-
  Built with Lean 4 and Mathlib. We thank their contributors and the manuscript
  authors for reviewing the source-to-Lean statement correspondence.
