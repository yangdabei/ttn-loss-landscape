name = "TTN"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["TTN"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.31.0"

[[lean_lib]]
name = "TTN"

# Comparator certificate modules. These are deliberately excluded from
# `defaultTargets`; Comparator builds them separately under Landrun.
[[lean_lib]]
name = "Challenge"
srcDir = "audit/comparator"

[[lean_lib]]
name = "Solution"
srcDir = "audit/comparator"
